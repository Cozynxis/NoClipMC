name: Build NoClipMC
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Build Fabric mod
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: NoClipMC-1.21.11
          path: build/libs/NoClipMC-1.0.0.jar
          if-no-files-found: error
      - name: Publish direct JAR download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view noclipmc-latest >/dev/null 2>&1 || gh release create noclipmc-latest --title "NoClipMC latest" --notes "Fabric 1.21.11 NoClipMC build"
          gh release upload noclipmc-latest build/libs/NoClipMC-1.0.0.jar --clobber
